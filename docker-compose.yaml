services:
  mudi-database:
    image: mariadb:lts
    container_name: mudi-database
    environment:
      MYSQL_ROOT_PASSWORD: mudi
      MYSQL_DATABASE: mudi
      MYSQL_USER: mudi
      MYSQL_PASSWORD: mudi
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-u", "mysql"]
      start_period: 15s
      timeout: 5s
      retries: 3
    network_mode: bridge
    ports:
      - '3306'
    volumes:
      - mudi-data:/var/lib/mysql
volumes:
  mudi-data:
    name: "mudi-data"